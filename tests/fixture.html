<!doctype html>
<html lang="en"><meta charset="utf-8"><title>X fixture</title>
<style>
  body{margin:0;background:#000;color:#e7e9ea;font:16px/1.5 Arial,sans-serif}
  nav{position:fixed;top:24px;left:30px}a{color:#1d9bf0}
  main{margin:30px auto;width:600px}article{padding:24px;border:1px solid #333}
  [data-testid=tweetText]{font-size:19px;white-space:pre-wrap}
  [role=region]{padding:20px}label{display:block;margin:12px 0}
  input,button{font:inherit;padding:8px} [role=link]{display:flex;justify-content:space-between;margin:10px 0}
  .duration{font-size:13px;color:#aaa}#spacer{height:1100px}
</style>
<nav><a data-testid="AppTabBar_Profile_Link" href="/tester">Profile</a></nav><main></main>
<script>
const main=document.querySelector('main');
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function render(){
 const data=await (await fetch('/__fixture/state')).json();
 document.querySelector('[data-testid=AppTabBar_Profile_Link]').href='/'+data.account;
 if(location.pathname==='/settings/muted_keywords'){
  main.innerHTML='<section role="region"><h2>Muted words</h2><a href="/settings/add_muted_keyword" aria-label="Add muted word or phrase">+</a><p>Words muted in your Home timeline and notifications.</p>'+data.words.map(w=>'<div role="link" tabindex="0"><div><div><span>'+esc(w.text)+'</span></div><div class="duration">Forever</div></div><div><button aria-label="Unmute">Unmute</button></div></div>').join('')+'</section>';
 }else if(location.pathname==='/settings/add_muted_keyword'){
  main.innerHTML='<section role="region"><h2>Add muted word</h2><label>Enter word or phrase<input name="keyword" type="text"></label><h2>Mute from</h2><label>Home timeline<input type="checkbox" checked></label><label>Notifications<input role="switch" type="checkbox" checked></label><label>From anyone<input type="radio" name="mute_notifications_option" checked></label><label>From people you don’t follow<input type="radio" name="mute_notifications_option"></label><h2>Duration</h2>'+['Until you unmute the word','24 hours','7 days','30 days'].map((s,i)=>'<label>'+s+'<input type="radio" name="time_duration" '+(!i?'checked':'')+'></label>').join('')+'<button data-testid="settingsDetailSave" disabled>Save</button><div role="alert"></div></section>';
  let controlledValue='';
  const input=main.querySelector('[name=keyword]'),save=main.querySelector('[data-testid=settingsDetailSave]');
  input.addEventListener('input',()=>{controlledValue=input.value;save.disabled=!controlledValue.trim();});
  save.onclick=async()=>{
   const body={text:controlledValue,home:main.querySelector('input[type=checkbox]:not([role])').checked,notifications:main.querySelector('[role=switch]').checked,audience:[...main.querySelectorAll('[name=mute_notifications_option]')].findIndex(e=>e.checked),duration:[...main.querySelectorAll('[name=time_duration]')].findIndex(e=>e.checked)};
   save.disabled=true;
   const result=await (await fetch('/__fixture/save',{method:'POST',body:JSON.stringify(body)})).json();
   if(result.error){main.querySelector('[role=alert]').textContent=result.error;save.disabled=false;}
   else location.assign('/settings/muted_keywords');
  };
 }else{
  main.innerHTML='<h1>Home</h1><article data-testid="tweet"><div data-testid="tweetText" lang="en">Café, cats and dogs. “Café” again. <a href="/topic">#Topic</a> from @some_user.</div></article><article data-testid="tweet"><div data-testid="tweetText" lang="en">An inline <span>multi</span><strong>part</strong> word and don’t.</div></article><div id="spacer"></div>';
  main.addEventListener('click',e=>{if(e.target.closest('article'))window.tweetClicks=(window.tweetClicks||0)+1;});
 }
}
render();
</script></html>
